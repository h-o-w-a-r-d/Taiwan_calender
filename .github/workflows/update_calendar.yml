name: Weekly Calendar Sync

on:
  schedule:
    # 每週一凌晨 00:00 (UTC) 執行，相當於台灣時間週一 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支援手動觸發執行

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run update script
        run: python update_calendar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add taiwan_holidays.ics
          if git diff --staged --quiet; then
            echo "No changes in ICS file."
          else
            git commit -m "Auto update Taiwan Holiday ICS [skip ci]"
            git push
          fi
