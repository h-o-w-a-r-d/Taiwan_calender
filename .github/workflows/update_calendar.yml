name: Daily Calendar Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每日 08:00 (UTC+8)
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests icalendar pytz
      
      - name: Run update script
        run: python update_calendar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          # 包含原始 CSV 以及所有新產生的 ICS 檔案
          git add 政府行政機關辦公日曆表.csv taiwan_holidays_full.ics taiwan_holidays.ics taiwan_events_full.ics taiwan_events.ics taiwan_calender_full.ics taiwan_calender.ics
          if git diff --staged --quiet; then
            echo "No changes in CSV or ICS files."
          else
            git commit -m "Auto update Raw CSV and ICS files [skip ci]"
            git push
          fi
