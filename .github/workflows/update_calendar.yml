name: Weekly Calendar Sync

on:
  schedule:
    - cron: '0 0 * * 1' # 每週一 08:00 (UTC+8)
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run update script
        run: python update_calendar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 同時保存 CSV 與 ICS 檔案
          git add 政府行政機關辦公日曆表.csv taiwan_holidays.ics
          if git diff --staged --quiet; then
            echo "No changes in CSV or ICS files."
          else
            git commit -m "Auto update Raw CSV and Holiday ICS [skip ci]"
            git push
          fi
